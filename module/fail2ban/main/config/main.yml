type: filestream
id: fail2ban-log
paths:
{{ range $i, $path := .paths }}
 - {{$path}}
{{ end }}
prospector.scanner.exclude_files: ['\.gz$']

# https://www.elastic.co/guide/en/beats/filebeat/7.x/filebeat-input-log.html#filebeat-input-log-include-lines
include_lines:
  # Matches lines beginning with date and time, followed by the word fail2ban, e.g:
  # 2025-07-08 12:22:58,125 fail2ban
  - '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3} fail2ban'
